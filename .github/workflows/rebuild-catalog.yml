name: Rebuild Voomi Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voomi-template-publishing
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Rebuild and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          python scripts/rebuild_catalog.py
          cp catalog.json site/catalog.json
          python scripts/verify_catalog.py
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json site/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild Voomi template catalog"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

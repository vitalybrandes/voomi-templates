name: Publish Voomi Template

on:
  push:
    branches: [main]
    paths:
      - 'incoming/**/*.zip'
      - 'scripts/**'
      - 'schemas/**'
      - '.github/workflows/publish-template.yml'
  workflow_dispatch:
    inputs:
      zip_path:
        description: Optional existing ZIP path under incoming/
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: voomi-template-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install GitHub CLI
        run: |
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
      - name: Verify required tools
        run: |
          python --version
          gh --version
      - name: Run automated tests
        run: python -m pytest tests/ -v
      - name: Publish templates
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_ZIP_PATH: ${{ inputs.zip_path }}
        run: python scripts/publish_template.py
      - name: Summarize package results
        if: always()
        env:
          REPORT_PATH: publish-report.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_PATH"])
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          successes = report.get("publishedOrSkipped", [])
          failures = report.get("failures", [])
          message = report.get("message")
          lines = ["## Voomi template publishing", "", f"Successful or already published: **{len(successes)}**", f"Failed packages: **{len(failures)}**"]
          if message:
              lines += ["", message]
          if failures:
              lines += ["", "| ZIP | Result |", "|---|---|"]
              for failure in failures:
                  package = str(failure.get("path", "unknown")).replace("|", "\\|").replace("\n", " ")
                  error = str(failure.get("error", "Unknown error")).replace("|", "\\|").replace("\n", " ")
                  lines.append(f"| `{package}` | {error} |")
                  command_message = f"{package}: {error}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::warning title=Template ZIP not published::{command_message}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as output:
                  output.write("\n".join(lines) + "\n")
          PY
      - name: Rebuild and verify catalog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/rebuild_catalog.py
          python scripts/verify_catalog.py
      - name: Commit generated files and remove processed packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f processed-packages.txt ]; then
            while IFS= read -r f; do [ -z "$f" ] || rm -- "$f"; done < processed-packages.txt
          fi
          git add catalog.json release-index.json previews/ incoming/
          if git diff --cached --quiet; then
            echo "No generated catalog changes"
          else
            git commit -m "chore: publish Voomi templates"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Generated publication commit conflicts with main; source ZIP remains available for recovery" >&2
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            echo "Unable to push generated publication data after retries" >&2
            exit 1
          fi
      - name: Upload publishing report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: voomi-publishing-report-${{ github.run_id }}
          path: |
            publish-report.json
            validation-report.json
          if-no-files-found: ignore
          retention-days: 7

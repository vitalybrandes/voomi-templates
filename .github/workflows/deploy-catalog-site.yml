name: Build and Deploy Voomi HTML Catalog

on:
  push:
    branches: [main]
    paths:
      - 'catalog.json'
      - 'site/catalog.json'
      - 'site/index.html'
      - '.github/workflows/deploy-catalog-site.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build HTML catalog
        run: |
          test -s site/index.html
          test -s catalog.json
          mkdir -p _site
          cp site/index.html _site/index.html
          cp catalog.json _site/catalog.json
          mkdir -p _site/site
          cp site/index.html _site/site/index.html
          cp catalog.json _site/site/catalog.json
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

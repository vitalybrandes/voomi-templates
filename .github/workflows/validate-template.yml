name: Validate Voomi Templates

on:
  pull_request:
    paths:
      - 'incoming/**/*.zip'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -v
      - name: Validate packages in incoming
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(incoming/**/*.zip)
          for f in "${files[@]}"; do python scripts/validate_template.py --zip "$f" --report "${f%.zip}.validation.json"; done
          rm -f incoming/**/*.validation.json

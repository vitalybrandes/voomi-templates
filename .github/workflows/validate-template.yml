name: Validate Voomi Templates

on:
  pull_request:
    paths:
      - 'incoming/**/*.zip'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -v
      - name: Validate packages in incoming
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          failures = []
          validated = 0
          reports = []
          for package in sorted(Path("incoming").rglob("*.zip")):
              report_path = package.with_suffix(".validation.json")
              reports.append(report_path)
              result = subprocess.run(
                  [sys.executable, "scripts/validate_template.py", "--zip", str(package), "--report", str(report_path)],
                  text=True,
                  capture_output=True,
              )
              if result.returncode == 0:
                  validated += 1
                  print(result.stdout, end="")
                  continue
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  error = "; ".join(report.get("errors", [])) or "Validation failed"
              except (OSError, json.JSONDecodeError):
                  error = result.stderr.strip() or result.stdout.strip() or "Validation failed"
              failures.append((package.as_posix(), error))
              message = f"{package.as_posix()}: {error}"
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=Template ZIP rejected::{message}")
              print(f"WARNING: {package}: {error}", file=sys.stderr)

          summary = ["## Incoming template validation", "", f"Valid ZIPs: **{validated}**", f"Rejected ZIPs: **{len(failures)}**"]
          if failures:
              summary += ["", "Rejected packages remain in `incoming/` and were not published.", "", "| ZIP | Validation result |", "|---|---|"]
              summary += ["| `{}` | {} |".format(path, error.replace("|", "\\|").replace("\n", " ")) for path, error in failures]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as output:
                  output.write("\n".join(summary) + "\n")
          for report_path in reports:
              report_path.unlink(missing_ok=True)
          PY

name: Validate Voomi Templates

on:
  pull_request:
    paths:
      - 'incoming/**/*.zip'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -v
      - name: Validate packages in incoming
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(incoming/**/*.zip)
          for f in "${files[@]}"; do python scripts/validate_template.py --zip "$f" --report "${f%.zip}.validation.json"; done
          rm -f incoming/**/*.validation.json
